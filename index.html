<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Surprise ❤️</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#ff758c,#ff7eb3,#ff9a9e,#fad0c4);
background-size:400% 400%;
animation:bg 12s ease infinite;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
position:relative;
z-index:10;
text-align:center;
width:90%;
max-width:550px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(12px);
padding:45px;
border-radius:25px;
box-shadow:0 15px 35px rgba(0,0,0,.2);
}

.title{
font-size:52px;
font-weight:700;
color:white;
letter-spacing:1px;
animation:pulse 2.5s infinite;
}

@keyframes pulse{
0%,100%{transform:scale(1);}
50%{transform:scale(1.03);}
}

.subtitle{
margin-top:20px;
font-size:20px;
color:white;
line-height:1.6;
}

input{
margin-top:35px;
width:100%;
padding:16px;
font-size:18px;
border:none;
border-radius:50px;
outline:none;
text-align:center;
}

button{
margin-top:20px;
padding:15px 45px;
font-size:18px;
border:none;
border-radius:50px;
cursor:pointer;
background:white;
color:#ff3d85;
font-weight:bold;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

#warning{
margin-top:18px;
font-size:18px;
font-weight:bold;
color:#fff176;
min-height:25px;
}

#success{
display:none;
position:absolute;
inset:0;
background:linear-gradient(135deg,#ff6fa8,#ff8ac5);
justify-content:center;
align-items:center;
flex-direction:column;
color:white;
font-size:30px;
font-weight:bold;
opacity:0;
transition:1s;
}

.loader{
margin-top:25px;
width:55px;
height:55px;
border:6px solid rgba(255,255,255,.4);
border-top:6px solid white;
border-radius:50%;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{transform:rotate(360deg);}
}

.heart{
position:absolute;
bottom:-40px;
font-size:22px;
animation:float linear infinite;
opacity:.7;
}

@keyframes float{

0%{
transform:translateY(0) rotate(0deg);
opacity:0;
}

20%{
opacity:1;
}

100%{
transform:translateY(-110vh) rotate(360deg);
opacity:0;
}

}

</style>
</head>

<body>

<div id="hearts"></div>

<div class="container">

<div class="title">
🎉 HAPPY BIRTHDAY Chota Don🎉
</div>

<div class="subtitle">
I have special wishes for you inside ❤️
</div>

<input
type="password"
id="password"
placeholder="Enter Password">

<button id="openBtn">
Open My Wishes ❤️
</button>

<div id="warning"></div>

</div>

<div id="success">

<div>
❤️ Password Accepted ❤️
</div>

<div style="margin-top:15px;font-size:22px;">
Preparing your surprise...
</div>

<div class="loader"></div>

</div>

  <script>

let password = "1133";
let attempts = 5;

const btn = document.getElementById("openBtn");
const input = document.getElementById("password");
const warning = document.getElementById("warning");
const success = document.getElementById("success");

btn.addEventListener("click", checkPassword);

input.addEventListener("keypress", function(e){
    if(e.key==="Enter"){
        checkPassword();
    }
});

function checkPassword(){

    if(input.value === password){

        warning.style.color="#7CFC00";
        warning.innerHTML="✔ Password Correct!";

        setTimeout(function(){

            document.querySelector(".container").style.display="none";

            success.style.display="flex";

            setTimeout(function(){
                success.style.opacity="1";
            },100);

            // Replace this with your Page 2 later
            setTimeout(function(){

                window.location.href = "page-2.html";

            },2200);

        },500);

        return;
    }

    attempts--;

    if(attempts>0){

        warning.style.color="#FFF176";

        warning.innerHTML=
        "❌ Incorrect Password.<br>" +
        "You have <b>"+attempts+"</b> attempt" +
        (attempts==1?"":"s") +
        " remaining.";

    }else{

        warning.style.color="#ff4d4d";

        warning.innerHTML=
        "🚫 Too many incorrect attempts.<br>Please come back later ❤️";

        input.disabled=true;
        btn.disabled=true;

        btn.style.opacity=".5";
        btn.style.cursor="not-allowed";
        input.style.opacity=".6";

    }

    input.value="";
    input.focus();

}


// Floating Hearts

const hearts=document.getElementById("hearts");

function createHeart(){

    const heart=document.createElement("div");

    heart.className="heart";

    heart.innerHTML=Math.random()>0.5?"❤️":"💖";

    heart.style.left=Math.random()*100+"vw";

    heart.style.fontSize=(18+Math.random()*22)+"px";

    heart.style.animationDuration=(6+Math.random()*5)+"s";

    hearts.appendChild(heart);

    setTimeout(()=>{
        heart.remove();
    },11000);

}

setInterval(createHeart,350);

</script>

</body>
</html>
