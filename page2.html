<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Radha ❤️</title>

<style>

/* =========================
   BASIC RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:Georgia, "Times New Roman", serif;
}


/* =========================
   SLIDE CONTAINER
========================= */

.slides-container{
    width:100%;
    height:100vh;
    position:relative;
}


/* =========================
   COMMON SLIDE DESIGN
========================= */

.slide{
    position:absolute;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:35px;

    opacity:0;
    visibility:hidden;

    transition:
        opacity .7s ease,
        transform .7s ease;

    transform:translateX(50px);
}

.slide.active{
    opacity:1;
    visibility:visible;
    transform:translateX(0);
}


/* =========================
   SLIDE 1
   PINK
========================= */

.slide1{
    background:#ffeaf3;
}


/* =========================
   SLIDE 2
   YELLOW
========================= */

.slide2{
    background:#fff9d9;
}


/* =========================
   SLIDE 3
   RED / PINK
========================= */

.slide3{
    background:#ffe4e4;
}


/* =========================
   GREETING CARD
========================= */

.card{
    width:100%;
    max-width:850px;
    height:85vh;

    position:relative;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    text-align:center;

    border-radius:30px;

    background:rgba(255,255,255,.35);

    box-shadow:
        0 15px 50px rgba(0,0,0,.12);

    overflow:hidden;
}


/* =========================
   FLOWER BORDER
========================= */

.flower-border{
    position:absolute;
    inset:10px;

    border:3px solid rgba(225,105,150,.45);

    border-radius:25px;

    pointer-events:none;
}

.flower-border::before,
.flower-border::after{
    content:"🌸 🌷 🌺 🌷 🌸";

    position:absolute;

    left:50%;
    transform:translateX(-50%);

    font-size:27px;

    letter-spacing:12px;

    white-space:nowrap;
}

.flower-border::before{
    top:-20px;
}

.flower-border::after{
    bottom:-20px;
}


/* =========================
   BALLOON BORDER
========================= */

.balloon-border{
    position:absolute;
    inset:10px;

    border:3px solid rgba(220,180,60,.45);

    border-radius:25px;

    pointer-events:none;
}

.balloon-border::before,
.balloon-border::after{
    content:"🎈 🎈 🎈 🎈 🎈";

    position:absolute;

    left:50%;
    transform:translateX(-50%);

    font-size:27px;

    letter-spacing:15px;

    white-space:nowrap;
}

.balloon-border::before{
    top:-20px;
}

.balloon-border::after{
    bottom:-20px;
}


/* =========================
   MESSAGE
========================= */

.message{
    position:relative;
    z-index:5;

    font-size:90px;

    font-weight:bold;

    color:#c84c78;

    text-shadow:
        2px 3px 5px rgba(0,0,0,.12);

    animation:messageAppear 1s ease;
}


/* Slide 2 message */

.slide2 .message{
    color:#c89b28;
}


/* Slide 3 message */

.slide3 .message{
    color:#c94f4f;
}


/* =========================
   MESSAGE ANIMATION
========================= */

@keyframes messageAppear{

    from{
        opacity:0;
        transform:scale(.7);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}


/* =========================
   NAVIGATION
========================= */

.navigation{
    position:absolute;

    bottom:45px;

    left:50%;

    transform:translateX(-50%);

    z-index:20;

    display:flex;

    gap:18px;
}


.nav-btn{

    border:none;

    padding:13px 30px;

    border-radius:30px;

    background:white;

    color:#c84c78;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 5px 15px rgba(0,0,0,.12);

    transition:.3s;
}


.nav-btn:hover{
    transform:translateY(-3px) scale(1.04);

    box-shadow:
        0 8px 20px rgba(0,0,0,.18);
}


.nav-btn:disabled{

    opacity:.4;

    cursor:not-allowed;

    transform:none;

}


/* =========================
   SLIDE INDICATORS
========================= */

.indicators{

    position:absolute;

    bottom:105px;

    left:50%;

    transform:translateX(-50%);

    display:flex;

    gap:10px;

    z-index:20;
}


.dot{

    width:10px;

    height:10px;

    border-radius:50%;

    background:rgba(0,0,0,.2);

    transition:.3s;
}


.dot.active{

    width:28px;

    border-radius:10px;

    background:#c84c78;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .card{
        height:88vh;
        padding:20px;
    }

    .message{
        font-size:65px;
    }

    .flower-border::before,
    .flower-border::after{
        font-size:20px;
        letter-spacing:5px;
    }

    .balloon-border::before,
    .balloon-border::after{
        font-size:20px;
        letter-spacing:5px;
    }

    .navigation{
        bottom:35px;
    }

    .nav-btn{
        padding:11px 22px;
        font-size:15px;
    }

}


/* =========================
   VERY SMALL PHONES
========================= */

@media(max-width:380px){

    .message{
        font-size:52px;
    }

    .nav-btn{
        padding:10px 18px;
    }

}

</style>

</head>


<body>


<div class="slides-container">


    <!-- =====================
         SLIDE 1
    ====================== -->

    <section class="slide slide1 active">

        <div class="card">

            <div class="flower-border"></div>

            <div class="message">
                Happy 
            </div>

        </div>

    </section>



    <!-- =====================
         SLIDE 2
    ====================== -->

    <section class="slide slide2">

        <div class="card">

            <div class="balloon-border"></div>

            <div class="message">
                Birthday
            </div>

        </div>

    </section>



    <!-- =====================
         SLIDE 3
    ====================== -->

    <section class="slide slide3">

        <div class="card">

            <div class="flower-border"></div>

            <div class="message">
                Radha
            </div>

        </div>

    </section>



    <!-- =====================
         NAVIGATION
    ====================== -->

    <div class="navigation">

        <button
            class="nav-btn"
            id="previousBtn"
            disabled>

            ← Previous

        </button>


        <button
            class="nav-btn"
            id="nextBtn">

            Next →

        </button>

    </div>



    <!-- =====================
         SLIDE INDICATORS
    ====================== -->

    <div class="indicators">

        <span class="dot active"></span>

        <span class="dot"></span>

        <span class="dot"></span>

    </div>


</div>


<!-- JavaScript will be added in Part 2 -->

<script>

const slides = document.querySelectorAll(".slide");
const dots = document.querySelectorAll(".dot");

const previousBtn = document.getElementById("previousBtn");
const nextBtn = document.getElementById("nextBtn");

let currentSlide = 0;


/* =========================
   SHOW SLIDE
========================= */

function showSlide(index){

    slides.forEach((slide, i) => {

        slide.classList.remove("active");

        if(i === index){
            slide.classList.add("active");
        }

    });


    /* Update dots */

    dots.forEach((dot, i) => {

        dot.classList.remove("active");

        if(i === index){
            dot.classList.add("active");
        }

    });


    /* Previous button */

    if(currentSlide === 0){

        previousBtn.disabled = true;

    }else{

        previousBtn.disabled = false;

    }


    /* Next button */

    if(currentSlide === slides.length - 1){

        nextBtn.disabled = true;

    }else{

        nextBtn.disabled = false;

    }

}


/* =========================
   NEXT BUTTON
========================= */

nextBtn.addEventListener("click", function(){

    if(currentSlide < slides.length - 1){

        currentSlide++;

        showSlide(currentSlide);

    }

});


/* =========================
   PREVIOUS BUTTON
========================= */

previousBtn.addEventListener("click", function(){

    if(currentSlide > 0){

        currentSlide--;

        showSlide(currentSlide);

    }

});


/* =========================
   CLICK DOT
========================= */

dots.forEach((dot, index) => {

    dot.addEventListener("click", function(){

        currentSlide = index;

        showSlide(currentSlide);

    });

});


/* =========================
   KEYBOARD SUPPORT
========================= */

document.addEventListener("keydown", function(event){

    if(event.key === "ArrowRight"){

        if(currentSlide < slides.length - 1){

            currentSlide++;

            showSlide(currentSlide);

        }

    }


    if(event.key === "ArrowLeft"){

        if(currentSlide > 0){

            currentSlide--;

            showSlide(currentSlide);

        }

    }

});


/* =========================
   INITIALIZE
========================= */

showSlide(currentSlide);

</script>

</body>

</html>
